<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình chỉnh sửa ảnh chụp - FullPage Capture</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <div class="logo-badge">
        <img src="../icons/icon48.png" alt="Logo" width="24" height="24">
        <span class="brand-name">FullPage Editor</span>
      </div>
      <div class="file-meta">
        <span id="doc-title" class="meta-title" title="Tiêu đề trang">Đang tải ảnh...</span>
        <span id="doc-dims" class="meta-dims">---</span>
      </div>
    </div>

    <div class="nav-center">
      <div class="tool-group zoom-group">
        <button id="btn-zoom-out" class="tool-btn" title="Thu nhỏ (Ctrl -)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <span id="zoom-level">100%</span>
        <button id="btn-zoom-in" class="tool-btn" title="Phóng to (Ctrl +)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button id="btn-zoom-fit" class="tool-btn" title="Vừa màn hình">Vừa màn hình</button>
      </div>

      <div class="divider"></div>

      <div class="tool-group edit-group">
        <button id="btn-crop-mode" class="tool-btn btn-feature">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"/></svg>
          <span>Cắt ảnh (Crop)</span>
        </button>
        <button id="btn-reset-crop" class="tool-btn" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span>Khôi phục gốc</span>
        </button>
      </div>
    </div>

    <div class="nav-right">
      <button id="btn-copy" class="action-btn action-outline" title="Sao chép vào Clipboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Sao chép</span>
      </button>
      <button id="btn-download-png" class="action-btn action-primary" title="Tải về ảnh PNG sắc nét">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Tải PNG</span>
      </button>
      <button id="btn-download-jpg" class="action-btn action-secondary" title="Tải về ảnh JPG nhẹ hơn">
        <span>JPG</span>
      </button>
      <button id="btn-download-pdf" class="action-btn action-secondary" title="Xuất file tài liệu PDF">
        <span>PDF</span>
      </button>
    </div>
  </header>

  <!-- Crop floating action bar when crop mode is on -->
  <div id="crop-actions-bar" class="crop-floating-bar" style="display: none;">
    <div class="crop-size-badge" id="crop-size-text">Kéo chuột để chọn vùng cắt</div>
    <div class="crop-btn-wrap">
      <button id="btn-apply-crop" class="crop-confirm-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Áp dụng cắt
      </button>
      <button id="btn-cancel-crop" class="crop-cancel-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Hủy
      </button>
    </div>
  </div>

  <main class="workspace" id="workspace">
    <div class="loading-spinner" id="loading-spinner">
      <div class="spinner"></div>
      <p>Đang xử lý và ghép nối ảnh cuộn toàn trang...</p>
    </div>

    <div class="canvas-container" id="canvas-container">
      <canvas id="main-canvas"></canvas>
      <!-- Interactive Crop Overlay -->
      <div id="crop-overlay" class="crop-overlay" style="display: none;">
        <div id="crop-box" class="crop-box">
          <div class="crop-handle handle-nw" data-dir="nw"></div>
          <div class="crop-handle handle-n" data-dir="n"></div>
          <div class="crop-handle handle-ne" data-dir="ne"></div>
          <div class="crop-handle handle-e" data-dir="e"></div>
          <div class="crop-handle handle-se" data-dir="se"></div>
          <div class="crop-handle handle-s" data-dir="s"></div>
          <div class="crop-handle handle-sw" data-dir="sw"></div>
          <div class="crop-handle handle-w" data-dir="w"></div>
          <div class="crop-grid-line line-h1"></div>
          <div class="crop-grid-line line-h2"></div>
          <div class="crop-grid-line line-v1"></div>
          <div class="crop-grid-line line-v2"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <script src="../lib/db.js"></script>
  <script src="editor.js"></script>
</body>
</html>
